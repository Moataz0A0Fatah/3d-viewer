<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            flex: 1;
        }

        /* --- Header with Logo Icon (No Frame) --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .header .logo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 12px;
            background: transparent;
            /* Removed border: 2px solid #444; */
        }
        h1 {
            color: #fff;
            font-weight: 300;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 0;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }
        .model-card {
            background: #2a2a2a;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
            padding-bottom: 15px;
        }
        .model-card:hover {
            transform: translateY(-10px);
            border-color: #4caf50;
            background: #333;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .model-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #111;
            display: block;
            border-bottom: 1px solid #444;
        }
        .model-card .model-name {
            display: block;
            color: #eee;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 15px 10px 5px 10px;
        }
        .model-card .click-hint {
            display: block;
            color: #666;
            font-size: 0.8rem;
        }

        /* --- Footer --- */
        .footer {
            width: 100%;
            text-align: center;
            padding: 30px 20px 10px 20px;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid #2a2a2a;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
        .footer span {
            color: #4caf50;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            h1 { font-size: 1.8rem; }
            .header .logo { width: 40px; height: 40px; }
            .footer { font-size: 0.7rem; padding: 20px 10px 5px 10px; }
        }
    </style>
</head>
<body>
