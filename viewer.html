<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>

    <!-- Import Map for Model-Viewer -->
    <script type="importmap">
    {
        "imports": {
            "@google/model-viewer": "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"
        }
    }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #111;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Full-screen 3D Viewer */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #111;
            display: block;
        }

        /* Back Button (Top-Left) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid #444;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4caf50;
            transform: scale(1.05);
        }

        /* Model Name (Top-Right) */
        .model-title {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: #eee;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid #333;
            pointer-events: none;
        }

        /* EXPOSURE SLIDER (Bottom-Right) */
        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 160px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .controls label {
            color: #aaa;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 300;
        }
        .controls input[type="range"] {
            width: 100%;
            accent-color: #4caf50;
            background: #444;
            height: 4px;
            border-radius: 2px;
            cursor: pointer;
        }
        .controls .value {
            color: #eee;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Status / Error Message */
        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 1.2rem;
            pointer-events: none;
            text-align: center;
            z-index: 0;
        }

        @media (max-width: 600px) {
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
            .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; }
            .controls { bottom: 20px; right: 20px; padding: 12px 15px; min-width: 140px; }
        }
    </style>
</head>
<body>

    <!-- Back Button -->
    <a href="index.html" class="back-btn">← Back to Library</a>

    <!-- Model Name -->
    <div class="model-title" id="modelTitle">Loading...</div>

    <!-- Exposure Controls -->
    <div class="controls">
        <label for="exposureSlider">🔆 Brightness</label>
        <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        <span class="value" id="exposureValue">1.00</span>
    </div>

    <!-- Status Message -->
    <div class="status-msg" id="statusMsg">👈 Select a model from the library</div>

    <!-- The 3D Viewer -->
    <model-viewer
        id="mainViewer"
        src=""
        camera-controls
        touch-action="pan-y"
        auto-rotate
        rotation-per-second="10deg"
        shadow-intensity="1.0"
        exposure="1.0"
        style="width: 100%; height: 100%;">
    </model-viewer>

    <script type="module">
        import "@google/model-viewer";

        const viewer = document.getElementById('mainViewer');
        const titleEl = document.getElementById('modelTitle');
        const statusMsg = document.getElementById('statusMsg');
        const slider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');

        // --- Get the model from the URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model');

        if (modelFile) {
            viewer.src = modelFile;
            statusMsg.style.display = 'none';

            // Extract name for display
            const displayName = modelFile.replace(/\.glb$/i, '').replace(/[-_]/g, ' ');
            titleEl.textContent = `📐 ${displayName}`;

            // --- Exposure Slider Logic ---
            slider.addEventListener('input', () => {
                const val = parseFloat(slider.value);
                viewer.exposure = val;
                exposureVal.textContent = val.toFixed(2);
            });

            // --- Error Handling ---
            viewer.addEventListener('error', (event) => {
                statusMsg.style.display = 'block';
                statusMsg.textContent = `❌ Failed to load "${modelFile}". Check filename.`;
                titleEl.textContent = '⚠️ Error';
                console.error('Model error:', event.detail);
            });

            // --- Success ---
            viewer.addEventListener('load', () => {
                statusMsg.style.display = 'none';
                console.log('✅ Model loaded!');
            });

        } else {
            statusMsg.style.display = 'block';
            statusMsg.innerHTML = '👈 No model selected. <br> Click "Back to Library" to choose one.';
            titleEl.textContent = 'No Model';
        }
    </script>
</body>
</html>
