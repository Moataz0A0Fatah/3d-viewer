<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>

    <script type="importmap">
    {
        "imports": {
            "@google/model-viewer": "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"
        }
    }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; height: 100vh; overflow: hidden; position: relative; }
        model-viewer { width: 100vw; height: 100vh; background-color: #111; display: block; }

        .controls-panel {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            background: rgba(20,20,20,0.9); backdrop-filter: blur(8px);
            padding: 18px 22px; border-radius: 16px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 12px; min-width: 210px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8); max-height: 80vh; overflow-y: auto;
        }
        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #aaa; font-size: 0.75rem; font-weight: 300; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
        .control-group label span { color: #eee; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #4caf50; background: #444; height: 4px; border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.75rem; }
        .checkbox-group input[type="checkbox"] { accent-color: #4caf50; width: 16px; height: 16px; cursor: pointer; }
        .reset-btn { background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid #4caf50; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.2s; text-align: center; margin-top: 4px; }
        .reset-btn:hover { background: rgba(76,175,80,0.5); transform: scale(1.02); }
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 20; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: white; border: 1px solid #444; padding: 12px 24px; border-radius: 50px; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .back-btn:hover { background: rgba(76,175,80,0.8); border-color: #4caf50; transform: scale(1.05); }
        .model-title { position: absolute; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); color: #eee; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; border: 1px solid #333; pointer-events: none; }
        .status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-size: 1.2rem; pointer-events: none; text-align: center; z-index: 0; }
        @media (max-width: 600px) { .controls-panel { bottom: 15px; right: 15px; padding: 12px 16px; min-width: 170px; max-height: 60vh; gap: 8px; } .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; } .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; } }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Library</a>
    <div class="model-title" id="modelTitle">Loading...</div>

    <div class="controls-panel">
        <div class="checkbox-group">
            <input type="checkbox" id="autoRotateCheck">
            <label for="autoRotateCheck">🔄 Auto-Rotate</label>
        </div>
        <div class="control-group">
            <label>🔆 Brightness <span id="exposureValue">1.00</span></label>
            <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>🌓 Shadow Intensity <span id="shadowValue">1.00</span></label>
            <input type="range" id="shadowSlider" min="0" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>🌫️ Shadow Softness <span id="softnessValue">1.00</span></label>
            <input type="range" id="softnessSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>☀️ Time of Day <span id="timeValue">12:00</span></label>
            <input type="range" id="timeSlider" min="6" max="18" step="0.1" value="12">
        </div>
        <div class="control-group">
            <label>✏️ Edge Lines <span id="edgeValue">0.00</span></label>
            <input type="range" id="edgeSlider" min="0" max="1.0" step="0.01" value="0">
        </div>
        <button class="reset-btn" id="resetBtn">↺ Reset All</button>
    </div>

    <div class="status-msg" id="statusMsg">👈 Select a model from the library</div>

    <!-- 3D Viewer with "neutral" built-in environment (no external URL needed) -->
    <model-viewer
        id="mainViewer"
        src=""
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.0"
        shadow-softness="1.0"
        exposure="1.0"
        light-direction="0.5 0.5 0.7"
        edge-render="false"
        edge-threshold="0"
        edge-color="#000000"
        environment-image="neutral"
        style="width: 100%; height: 100%;">
    </model-viewer>

    <script type="module">
        import "@google/model-viewer";

        const viewer = document.getElementById('mainViewer');
        const titleEl = document.getElementById('modelTitle');
        const statusMsg = document.getElementById('statusMsg');

        const exposureSlider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');
        const shadowSlider = document.getElementById('shadowSlider');
        const shadowVal = document.getElementById('shadowValue');
        const softnessSlider = document.getElementById('softnessSlider');
        const softnessVal = document.getElementById('softnessValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeValue');
        const edgeSlider = document.getElementById('edgeSlider');
        const edgeVal = document.getElementById('edgeValue');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const resetBtn = document.getElementById('resetBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model');

        if (modelFile) {
            viewer.src = modelFile;
            statusMsg.style.display = 'none';
            const displayName = modelFile.replace(/\.glb$/i, '').replace(/[-_]/g, ' ');
            titleEl.textContent = `📐 ${displayName}`;

            // --- Auto-Rotate ---
            autoRotateCheck.addEventListener('change', () => {
                viewer.autoRotate = autoRotateCheck.checked;
                viewer.rotationPerSecond = autoRotateCheck.checked ? '10deg' : '0deg';
                console.log('Auto-Rotate:', viewer.autoRotate);
            });

            // --- Exposure ---
            exposureSlider.addEventListener('input', () => {
                const val = parseFloat(exposureSlider.value);
                viewer.exposure = val;
                exposureVal.textContent = val.toFixed(2);
                console.log('Exposure:', val);
            });

            // --- Shadow Intensity ---
            shadowSlider.addEventListener('input', () => {
                const val = parseFloat(shadowSlider.value);
                viewer.shadowIntensity = val;
                shadowVal.textContent = val.toFixed(2);
                console.log('Shadow Intensity:', val);
            });

            // --- Shadow Softness ---
            softnessSlider.addEventListener('input', () => {
                const val = parseFloat(softnessSlider.value);
                viewer.shadowSoftness = val;
                softnessVal.textContent = val.toFixed(2);
                console.log('Shadow Softness:', val);
            });

            // --- Time of Day ---
            function updateSunDirection(time) {
                const t = (time - 6) / 12;
                const azimuthDeg = 90 + t * 180;
                const elevationDeg = 60 * Math.sin(Math.PI * t);
                const azimuthRad = azimuthDeg * Math.PI / 180;
                const elevationRad = elevationDeg * Math.PI / 180;
                const x = Math.cos(azimuthRad) * Math.cos(elevationRad);
                const y = Math.sin(elevationRad);
                const z = Math.sin(azimuthRad) * Math.cos(elevationRad);
                viewer.lightDirection = `${x} ${y} ${z}`;
                console.log(`Light direction: ${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`);
            }

            timeSlider.addEventListener('input', () => {
                const time = parseFloat(timeSlider.value);
                const hours = Math.floor(time);
                const minutes = Math.round((time - hours) * 60);
                timeVal.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
                updateSunDirection(time);
            });

            // --- Edge Lines ---
            edgeSlider.addEventListener('input', () => {
                const val = parseFloat(edgeSlider.value);
                edgeVal.textContent = val.toFixed(2);
                if (val > 0.001) {
                    viewer.edgeRender = true;
                    viewer.edgeThreshold = val;
                    viewer.edgeColor = '#000000';
                } else {
                    viewer.edgeRender = false;
                }
                console.log('Edge Threshold:', val, 'Edge Render:', viewer.edgeRender);
            });

            // --- Reset ---
            resetBtn.addEventListener('click', () => {
                autoRotateCheck.checked = false;
                viewer.autoRotate = false;
                viewer.rotationPerSecond = '0deg';

                exposureSlider.value = '1.0';
                exposureVal.textContent = '1.00';
                viewer.exposure = 1.0;

                shadowSlider.value = '1.0';
                shadowVal.textContent = '1.00';
                viewer.shadowIntensity = 1.0;

                softnessSlider.value = '1.0';
                softnessVal.textContent = '1.00';
                viewer.shadowSoftness = 1.0;

                timeSlider.value = '12';
                timeVal.textContent = '12:00';
                updateSunDirection(12);

                edgeSlider.value = '0';
                edgeVal.textContent = '0.00';
                viewer.edgeRender = false;

                console.log('Reset all controls');
            });

            // Initialize
            updateSunDirection(12);
            timeVal.textContent = '12:00';
            viewer.autoRotate = false;
            viewer.rotationPerSecond = '0deg';

            viewer.addEventListener('error', (event) => {
                statusMsg.style.display = 'block';
                statusMsg.textContent = `❌ Failed to load "${modelFile}". Check filename.`;
                titleEl.textContent = '⚠️ Error';
                console.error('Model error:', event.detail);
            });

            viewer.addEventListener('load', () => {
                statusMsg.style.display = 'none';
                console.log('✅ Model loaded successfully!');
            });

        } else {
            statusMsg.style.display = 'block';
            statusMsg.innerHTML = '👈 No model selected. <br> Click "Back to Library" to choose one.';
            titleEl.textContent = 'No Model';
        }
    </script>
</body>
</html>
