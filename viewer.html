<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer (Three.js)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; overflow: hidden; }
        canvas { display: block; }

        .controls-panel {
            position: absolute; bottom: 30px; right: 30px; z-index: 10;
            background: rgba(20,20,20,0.92); backdrop-filter: blur(8px);
            padding: 18px 22px; border-radius: 16px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 12px; min-width: 200px;
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }
        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #aaa; font-size: 0.75rem; font-weight: 300; display: flex; justify-content: space-between; }
        .control-group label span { color: #eee; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #4caf50; background: #444; height: 4px; border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.75rem; }
        .checkbox-group input[type="checkbox"] { accent-color: #4caf50; width: 16px; height: 16px; cursor: pointer; }
        .action-btn {
            background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid #4caf50;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            font-weight: 500; transition: all 0.2s; text-align: center; margin-top: 4px;
        }
        .action-btn:hover { background: rgba(76,175,80,0.5); transform: scale(1.02); }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            color: white; border: 1px solid #444; padding: 12px 24px;
            border-radius: 50px; font-size: 1rem; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover { background: rgba(76,175,80,0.8); border-color: #4caf50; transform: scale(1.05); }
        .model-title {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            color: #eee; padding: 10px 20px; border-radius: 30px;
            font-size: 0.9rem; border: 1px solid #333; pointer-events: none;
        }
        .status-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #888; font-size: 1.1rem; pointer-events: none; text-align: center; z-index: 0;
            background: rgba(0,0,0,0.6); padding: 20px 30px; border-radius: 12px;
            border: 1px solid #333;
            max-width: 80%;
            line-height: 1.6;
        }
        .status-msg .error { color: #ff6b6b; }
        .status-msg .small { font-size: 0.8rem; color: #666; }
        @media (max-width: 600px) {
            .controls-panel { bottom: 15px; right: 15px; padding: 12px 16px; min-width: 170px; max-height: 60vh; gap: 8px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
            .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Library</a>
    <div class="model-title" id="modelTitle">Loading...</div>
    <div class="status-msg" id="statusMsg">⏳ Loading model...</div>

    <div class="controls-panel">
        <div class="checkbox-group">
            <input type="checkbox" id="autoRotateCheck">
            <label for="autoRotateCheck">🔄 Auto-Rotate</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="sunToggle" checked>
            <label for="sunToggle">☀️ Sun On/Off</label>
        </div>
        <div class="control-group">
            <label>🔆 Brightness (Exposure) <span id="exposureValue">1.00</span></label>
            <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>☀️ Sun Time <span id="timeValue">12:00</span></label>
            <input type="range" id="timeSlider" min="6" max="18" step="0.1" value="12">
        </div>
        <hr style="border-color:#444; width:100%;">
        <div class="control-group">
            <label>💡 Fill Light Intensity <span id="fillIntensityValue">0.30</span></label>
            <input type="range" id="fillIntensitySlider" min="0" max="1.0" step="0.01" value="0.3">
        </div>
        <div class="control-group">
            <label>💡 Fill Azimuth <span id="fillAzimuthValue">180</span></label>
            <input type="range" id="fillAzimuthSlider" min="0" max="360" step="1" value="180">
        </div>
        <div class="control-group">
            <label>💡 Fill Elevation <span id="fillElevationValue">30</span></label>
            <input type="range" id="fillElevationSlider" min="0" max="90" step="1" value="30">
        </div>
        <button class="action-btn" id="resetViewBtn">🎯 Reset View</button>
        <button class="action-btn" id="resetAllBtn">↺ Reset All</button>
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- DOM refs ---
        const statusMsg = document.getElementById('statusMsg');
        const titleEl = document.getElementById('modelTitle');

        const exposureSlider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeValue');
        const fillIntensitySlider = document.getElementById('fillIntensitySlider');
        const fillIntensityVal = document.getElementById('fillIntensityValue');
        const fillAzimuthSlider = document.getElementById('fillAzimuthSlider');
        const fillAzimuthVal = document.getElementById('fillAzimuthValue');
        const fillElevationSlider = document.getElementById('fillElevationSlider');
        const fillElevationVal = document.getElementById('fillElevationValue');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const sunToggle = document.getElementById('sunToggle');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');

        // --- Three.js setup ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; // controlled by slider
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // --- Lights ---

        // 1. Sun (directional) – casts shadows
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(5, 10, 7);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.001;
        sunLight.shadow.radius = 4;
        scene.add(sunLight);

        // 2. Fill light (directional) – no shadows, positionable
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.3);
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        // Small ambient to avoid complete darkness
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
        scene.add(ambientLight);

        // --- Ground plane (shadow catcher) ---
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.ShadowMaterial({
            opacity: 0.2,
            color: 0x888888,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, -0.01, 0);
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Model loading ---
        const urlParams = new URLSearchParams(window.location.search);
        let modelFile = urlParams.get('model');

        let modelGroup = null;

        function repositionGround(box) {
            const centerX = (box.min.x + box.max.x) / 2;
            const centerZ = (box.min.z + box.max.z) / 2;
            const bottomY = box.min.y - 0.01;
            ground.position.set(centerX, bottomY, centerZ);
        }

        function fitCameraToGroup(group) {
            const box = new THREE.Box3().setFromObject(group);
            const size = box.max.sub(box.min);
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 1.8;
            camera.position.set(0, distance * 0.6, distance);
            controls.target.copy(box.center);
            controls.update();
            repositionGround(box);
        }

        function loadModel(url) {
            const fileName = url.split('/').pop();
            statusMsg.innerHTML = `⏳ Loading <span style="color:#888;">${fileName}</span>...<br><span class="small">${url}</span>`;
            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    statusMsg.style.display = 'none';
                    titleEl.textContent = `📐 ${fileName.replace(/\.glb$/i,'')}`;
                    if (modelGroup) {
                        scene.remove(modelGroup);
                    }
                    modelGroup = gltf.scene;
                    modelGroup.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material) {
                                // Ensure material responds to lights
                                const oldMat = node.material;
                                const newMat = new THREE.MeshStandardMaterial({
                                    color: oldMat.color ? oldMat.color : 0xffffff,
                                    map: oldMat.map || undefined,
                                    roughness: oldMat.roughness !== undefined ? oldMat.roughness : 0.5,
                                    metalness: oldMat.metalness !== undefined ? oldMat.metalness : 0.0,
                                    envMap: null,
                                    emissive: new THREE.Color(0x000000),
                                });
                                node.material = newMat;
                                node.material.needsUpdate = true;
                            }
                        }
                    });
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    console.log('✅ Model loaded:', url);
                },
                undefined,
                (err) => {
                    console.error('❌ Model load failed:', err);
                    statusMsg.innerHTML = `
                        <span class="error">❌ Failed to load: ${fileName}</span><br>
                        <span class="small">Tried: ${url}</span><br>
                        <span style="color:#888;font-size:0.8rem;">Check that the file exists and is accessible.</span>
                    `;
                    titleEl.textContent = '⚠️ Error';
                }
            );
        }

        if (modelFile) {
            if (!modelFile.toLowerCase().endsWith('.glb')) {
                modelFile += '.glb';
            }
            const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');
            const fullUrl = baseUrl + modelFile;
            loadModel(fullUrl);
        } else {
            statusMsg.innerHTML = '👈 No model specified. Please add ?model=yourfile.glb to the URL.';
            titleEl.textContent = 'No Model';
        }

        // --- Controls ---

        // Sun position (Time of Day)
        function updateSunDirection(time) {
            const t = (time - 6) / 12;
            const azimuthDeg = 90 + t * 180;
            const elevationDeg = 60 * Math.sin(Math.PI * t);
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad);
            const y = Math.sin(elevationRad);
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad);
            sunLight.position.set(x * 10, y * 10, z * 10);
            sunLight.target.position.set(0, 0, 0);
            sunLight.target.updateMatrixWorld();
        }

        // Fill light position from azimuth/elevation
        function updateFillPosition(azimuthDeg, elevationDeg) {
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const radius = 8;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad) * radius;
            const y = Math.sin(elevationRad) * radius;
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad) * radius;
            fillLight.position.set(x, y, z);
            fillLight.target.position.set(0, 0, 0);
            fillLight.target.updateMatrixWorld();
        }

        // Brightness = exposure
        exposureSlider.addEventListener('input', () => {
            const val = parseFloat(exposureSlider.value);
            renderer.toneMappingExposure = val;
            exposureVal.textContent = val.toFixed(2);
        });

        timeSlider.addEventListener('input', () => {
            const time = parseFloat(timeSlider.value);
            const hours = Math.floor(time);
            const minutes = Math.round((time - hours) * 60);
            timeVal.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
            updateSunDirection(time);
        });

        fillIntensitySlider.addEventListener('input', () => {
            const val = parseFloat(fillIntensitySlider.value);
            fillLight.intensity = val;
            fillIntensityVal.textContent = val.toFixed(2);
        });

        fillAzimuthSlider.addEventListener('input', () => {
            const az = parseFloat(fillAzimuthSlider.value);
            const el = parseFloat(fillElevationSlider.value);
            fillAzimuthVal.textContent = az;
            updateFillPosition(az, el);
        });

        fillElevationSlider.addEventListener('input', () => {
            const az = parseFloat(fillAzimuthSlider.value);
            const el = parseFloat(fillElevationSlider.value);
            fillElevationVal.textContent = el;
            updateFillPosition(az, el);
        });

        autoRotateCheck.addEventListener('change', () => {
            controls.autoRotate = autoRotateCheck.checked;
            controls.autoRotateSpeed = 2.0;
        });

        sunToggle.addEventListener('change', () => {
            sunLight.visible = sunToggle.checked;
        });

        resetViewBtn.addEventListener('click', () => {
            if (modelGroup) {
                fitCameraToGroup(modelGroup);
            }
        });

        resetAllBtn.addEventListener('click', () => {
            exposureSlider.value = '1.0';
            exposureVal.textContent = '1.00';
            renderer.toneMappingExposure = 1.0;

            timeSlider.value = '12';
            timeVal.textContent = '12:00';
            updateSunDirection(12);

            fillIntensitySlider.value = '0.3';
            fillIntensityVal.textContent = '0.30';
            fillLight.intensity = 0.3;

            fillAzimuthSlider.value = '180';
            fillAzimuthVal.textContent = '180';
            fillElevationSlider.value = '30';
            fillElevationVal.textContent = '30';
            updateFillPosition(180, 30);

            autoRotateCheck.checked = false;
            controls.autoRotate = false;
            sunToggle.checked = true;
            sunLight.visible = true;

            resetViewBtn.click();
        });

        // Init
        updateSunDirection(12);
        updateFillPosition(180, 30);
        timeVal.textContent = '12:00';

        // --- Resize ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // --- Animation ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.THREE_VIEWER = { scene, camera, renderer, controls, sunLight, fillLight };
    </script>
</body>
</html>
