<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer (Three.js)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; overflow: hidden; }
        canvas { display: block; }

        .controls-panel {
            position: absolute; bottom: 30px; right: 30px; z-index: 10;
            background: rgba(20,20,20,0.92); backdrop-filter: blur(8px);
            padding: 18px 22px; border-radius: 16px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 12px; min-width: 220px;
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }
        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #aaa; font-size: 0.75rem; font-weight: 300; display: flex; justify-content: space-between; }
        .control-group label span { color: #eee; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #4caf50; background: #444; height: 4px; border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.75rem; }
        .checkbox-group input[type="checkbox"] { accent-color: #4caf50; width: 16px; height: 16px; cursor: pointer; }
        .action-btn {
            background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid #4caf50;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            font-weight: 500; transition: all 0.2s; text-align: center; margin-top: 4px;
        }
        .action-btn:hover { background: rgba(76,175,80,0.5); transform: scale(1.02); }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            color: white; border: 1px solid #444; padding: 12px 24px;
            border-radius: 50px; font-size: 1rem; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover { background: rgba(76,175,80,0.8); border-color: #4caf50; transform: scale(1.05); }
        .model-title {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            color: #eee; padding: 10px 20px; border-radius: 30px;
            font-size: 0.9rem; border: 1px solid #333; pointer-events: none;
        }
        .status-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #888; font-size: 1.1rem; pointer-events: none; text-align: center; z-index: 0;
            background: rgba(0,0,0,0.6); padding: 20px 30px; border-radius: 12px;
            border: 1px solid #333;
            max-width: 80%;
            line-height: 1.6;
        }
        .status-msg .error { color: #ff6b6b; }
        .status-msg .success { color: #4caf50; }
        .status-msg .small { font-size: 0.8rem; color: #666; }
        .status-msg a { color: #4caf50; pointer-events: auto; }
        @media (max-width: 600px) {
            .controls-panel { bottom: 15px; right: 15px; padding: 12px 16px; min-width: 170px; max-height: 60vh; gap: 8px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
            .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Library</a>
    <div class="model-title" id="modelTitle">Loading...</div>
    <div class="status-msg" id="statusMsg">⏳ Loading model...</div>

    <div class="controls-panel">
        <div class="checkbox-group">
            <input type="checkbox" id="autoRotateCheck">
            <label for="autoRotateCheck">🔄 Auto-Rotate</label>
        </div>
        <div class="control-group">
            <label>🔆 Brightness <span id="exposureValue">1.00</span></label>
            <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>💡 Ambient Light <span id="ambientValue">0.50</span></label>
            <input type="range" id="ambientSlider" min="0" max="10" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>🌓 Shadow Intensity <span id="shadowValue">2.00</span></label>
            <input type="range" id="shadowSlider" min="0" max="3.0" step="0.01" value="2.0">
        </div>
        <div class="control-group">
            <label>🌫️ Shadow Softness <span id="softnessValue">0.50</span></label>
            <input type="range" id="softnessSlider" min="0.1" max="2.0" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>☀️ Sun Position (Time) <span id="timeValue">12:00</span></label>
            <input type="range" id="timeSlider" min="6" max="18" step="0.1" value="12">
        </div>
        <div class="control-group">
            <label>✏️ Edge Width <span id="edgeValue">2.0</span></label>
            <input type="range" id="edgeSlider" min="0" max="4" step="0.1" value="2.0">
        </div>
        <button class="action-btn" id="resetViewBtn">🎯 Reset View</button>
        <button class="action-btn" id="resetAllBtn">↺ Reset All</button>
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- DOM refs ---
        const statusMsg = document.getElementById('statusMsg');
        const titleEl = document.getElementById('modelTitle');

        const exposureSlider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');
        const ambientSlider = document.getElementById('ambientSlider');
        const ambientVal = document.getElementById('ambientValue');
        const shadowSlider = document.getElementById('shadowSlider');
        const shadowVal = document.getElementById('shadowValue');
        const softnessSlider = document.getElementById('softnessSlider');
        const softnessVal = document.getElementById('softnessValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeValue');
        const edgeSlider = document.getElementById('edgeSlider');
        const edgeVal = document.getElementById('edgeValue');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');

        // --- Three.js setup ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.1;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -10;
        mainLight.shadow.camera.right = 10;
        mainLight.shadow.camera.top = 10;
        mainLight.shadow.camera.bottom = -10;
        mainLight.shadow.bias = -0.001;
        scene.add(mainLight);

        // Fill light
        const fillLight = new THREE.DirectionalLight(0x446688, 0.2);
        fillLight.position.set(-5, -2, 5);
        scene.add(fillLight);

        // --- Ground plane ---
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.4, color: 0x222222 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20, 0x666666, 0x333333);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // --- Post-processing (Outline) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
        outlinePass.edgeStrength = 5.0;      // fixed high strength for solid black
        outlinePass.edgeGlow = 0.0;
        outlinePass.edgeThickness = 2.0;     // controlled by slider
        outlinePass.pulsePeriod = 0;
        outlinePass.visibleEdgeColor.set(0x000000);
        outlinePass.hiddenEdgeColor.set(0x000000);
        composer.addPass(outlinePass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // --- Fallback box ---
        function createFallbackBox() {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.3, metalness: 0.1 });
            const box = new THREE.Mesh(geo, mat);
            box.castShadow = true;
            box.receiveShadow = true;
            box.position.y = 0.75;
            const group = new THREE.Group();
            group.add(box);
            // Add small sphere on top
            const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.2 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.set(0, 1.5, 0);
            sphere.castShadow = true;
            group.add(sphere);
            return group;
        }

        // --- Model loading ---
        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model');

        let modelGroup = null;
        let modelLoaded = false;

        function fitCameraToGroup(group) {
            const box = new THREE.Box3().setFromObject(group);
            const size = box.max.sub(box.min);
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 1.8;
            camera.position.set(0, distance * 0.6, distance);
            controls.target.copy(box.center);
            controls.update();
            ground.position.y = box.min.y - 0.01;
            gridHelper.position.y = box.min.y - 0.01;
        }

        function loadModel(url) {
            const fileName = url.split('/').pop();
            statusMsg.innerHTML = `⏳ Loading <span style="color:#888;">${fileName}</span>...<br><span class="small">from ${url}</span>`;
            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    statusMsg.style.display = 'none';
                    titleEl.textContent = `📐 ${fileName.replace('.glb','')}`;
                    if (modelGroup) {
                        scene.remove(modelGroup);
                    }
                    modelGroup = gltf.scene;
                    modelGroup.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material) node.material.needsUpdate = true;
                        }
                    });
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    outlinePass.selectedObjects = [modelGroup];
                    modelLoaded = true;
                    console.log('✅ Model loaded:', url);
                },
                undefined,
                (err) => {
                    console.error('❌ Model load failed:', err);
                    statusMsg.innerHTML = `
                        <span class="error">❌ Failed to load: ${fileName}</span><br>
                        <span class="small">Tried: ${url}</span><br>
                        <span style="color:#888;font-size:0.8rem;">Loading fallback box instead...</span>
                    `;
                    // Load fallback
                    if (modelGroup) scene.remove(modelGroup);
                    modelGroup = createFallbackBox();
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    outlinePass.selectedObjects = [modelGroup];
                    modelLoaded = true;
                    titleEl.textContent = '📐 Fallback (Model not found)';
                    setTimeout(() => {
                        statusMsg.style.display = 'none';
                    }, 3000);
                }
            );
        }

        // --- Determine the base URL ---
        // If the page is served from a subdirectory, we need to use that.
        const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');

        if (modelFile) {
            const fullUrl = baseUrl + modelFile;
            loadModel(fullUrl);
        } else {
            // No model specified – show fallback
            statusMsg.innerHTML = '👈 No model selected. Loading fallback box...';
            modelGroup = createFallbackBox();
            scene.add(modelGroup);
            fitCameraToGroup(modelGroup);
            outlinePass.selectedObjects = [modelGroup];
            modelLoaded = true;
            titleEl.textContent = '📐 Fallback (No model)';
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 1500);
        }

        // --- Controls ---
        function updateSunDirection(time) {
            const t = (time - 6) / 12;
            const azimuthDeg = 90 + t * 180;
            const elevationDeg = 60 * Math.sin(Math.PI * t);
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad);
            const y = Math.sin(elevationRad);
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad);
            mainLight.position.set(x * 10, y * 10, z * 10);
            mainLight.target.position.set(0, 0, 0);
            mainLight.target.updateMatrixWorld();
        }

        exposureSlider.addEventListener('input', () => {
            const val = parseFloat(exposureSlider.value);
            renderer.toneMappingExposure = val;
            exposureVal.textContent = val.toFixed(2);
        });

        ambientSlider.addEventListener('input', () => {
            const val = parseFloat(ambientSlider.value);
            ambientLight.intensity = val;
            ambientVal.textContent = val.toFixed(1);
        });

        shadowSlider.addEventListener('input', () => {
            const val = parseFloat(shadowSlider.value);
            mainLight.intensity = val;
            shadowVal.textContent = val.toFixed(2);
        });

        softnessSlider.addEventListener('input', () => {
            const val = parseFloat(softnessSlider.value);
            mainLight.shadow.radius = val * 2;
            softnessVal.textContent = val.toFixed(2);
        });

        timeSlider.addEventListener('input', () => {
            const time = parseFloat(timeSlider.value);
            const hours = Math.floor(time);
            const minutes = Math.round((time - hours) * 60);
            timeVal.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
            updateSunDirection(time);
        });

        edgeSlider.addEventListener('input', () => {
            const val = parseFloat(edgeSlider.value);
            edgeVal.textContent = val.toFixed(1);
            outlinePass.edgeThickness = val;
            // edgeStrength stays fixed at 5 (strong black)
        });

        autoRotateCheck.addEventListener('change', () => {
            controls.autoRotate = autoRotateCheck.checked;
            controls.autoRotateSpeed = 2.0;
        });

        resetViewBtn.addEventListener('click', () => {
            if (modelGroup) {
                fitCameraToGroup(modelGroup);
            }
        });

        resetAllBtn.addEventListener('click', () => {
            exposureSlider.value = '1.0';
            exposureVal.textContent = '1.00';
            renderer.toneMappingExposure = 1.0;

            ambientSlider.value = '0.5';
            ambientVal.textContent = '0.5';
            ambientLight.intensity = 0.5;

            shadowSlider.value = '2.0';
            shadowVal.textContent = '2.00';
            mainLight.intensity = 2.0;

            softnessSlider.value = '0.5';
            softnessVal.textContent = '0.50';
            mainLight.shadow.radius = 1.0;

            timeSlider.value = '12';
            timeVal.textContent = '12:00';
            updateSunDirection(12);

            edgeSlider.value = '2.0';
            edgeVal.textContent = '2.0';
            outlinePass.edgeThickness = 2.0;
            outlinePass.edgeStrength = 5.0;

            autoRotateCheck.checked = false;
            controls.autoRotate = false;

            resetViewBtn.click();
        });

        // Init sun
        updateSunDirection(12);

        // --- Resize ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            outlinePass.resolution.set(w, h);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            composer.render();
        }
        animate();

        window.THREE_VIEWER = { scene, camera, renderer, controls, mainLight, outlinePass, ambientLight };
    </script>
</body>
</html>
