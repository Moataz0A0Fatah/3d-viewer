<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer – Measure & Sections</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; overflow: hidden; }
        canvas { display: block; }

        .controls-panel {
            position: absolute; bottom: 30px; right: 30px; z-index: 10;
            background: rgba(20,20,20,0.92); backdrop-filter: blur(8px);
            padding: 18px 22px; border-radius: 16px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 12px; min-width: 220px;
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }
        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #aaa; font-size: 0.75rem; font-weight: 300; display: flex; justify-content: space-between; }
        .control-group label span { color: #eee; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #4caf50; background: #444; height: 4px; border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.75rem; }
        .checkbox-group input[type="checkbox"] { accent-color: #4caf50; width: 16px; height: 16px; cursor: pointer; }
        .action-btn {
            background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid #4caf50;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            font-weight: 500; transition: all 0.2s; text-align: center; margin-top: 4px;
        }
        .action-btn:hover { background: rgba(76,175,80,0.5); transform: scale(1.02); }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            color: white; border: 1px solid #444; padding: 12px 24px;
            border-radius: 50px; font-size: 1rem; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover { background: rgba(76,175,80,0.8); border-color: #4caf50; transform: scale(1.05); }
        .model-title {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            color: #eee; padding: 10px 20px; border-radius: 30px;
            font-size: 0.9rem; border: 1px solid #333; pointer-events: none;
        }
        .status-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #888; font-size: 1.1rem; pointer-events: none; text-align: center; z-index: 0;
            background: rgba(0,0,0,0.6); padding: 20px 30px; border-radius: 12px;
            border: 1px solid #333;
            max-width: 80%;
            line-height: 1.6;
        }
        .status-msg .error { color: #ff6b6b; }
        .status-msg .small { font-size: 0.8rem; color: #666; }

        .measure-label {
            position: absolute; top: 80px; left: 20px; z-index: 20;
            background: rgba(0,0,0,0.7); color: #4caf50;
            padding: 8px 16px; border-radius: 8px;
            font-size: 0.9rem; font-family: monospace;
            border: 1px solid #4caf50;
            pointer-events: none;
            display: none;
        }
        .measure-label.active { display: block; }

        .section-controls {
            border-top: 1px solid #444; padding-top: 10px;
            margin-top: 4px;
        }
        .section-controls .row {
            display: flex; align-items: center; gap: 8px;
            margin-top: 4px;
        }
        .section-controls .row label {
            color: #aaa; font-size: 0.7rem; width: 20px;
        }
        .section-controls .row input[type="range"] {
            flex: 1;
        }
        .section-controls .row input[type="checkbox"] {
            margin-right: 2px;
        }

        @media (max-width: 600px) {
            .controls-panel { bottom: 15px; right: 15px; padding: 12px 16px; min-width: 170px; max-height: 60vh; gap: 8px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
            .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; }
            .measure-label { top: 70px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Library</a>
    <div class="model-title" id="modelTitle">Loading...</div>
    <div class="status-msg" id="statusMsg">⏳ Loading model...</div>
    <div class="measure-label" id="measureLabel">📏 0.000 m</div>

    <div class="controls-panel">
        <div class="checkbox-group">
            <input type="checkbox" id="autoRotateCheck">
            <label for="autoRotateCheck">🔄 Auto-Rotate</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="sunToggle" checked>
            <label for="sunToggle">☀️ Sun On/Off</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="showBoxCheck" checked>
            <label for="showBoxCheck">📦 Bounding Box</label>
        </div>
        <div class="control-group">
            <label>🔆 Brightness <span id="exposureValue">1.00</span></label>
            <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>☀️ Sun Time <span id="timeValue">10:00</span></label>
            <input type="range" id="timeSlider" min="6" max="18" step="0.1" value="10">
        </div>
        <hr style="border-color:#444; width:100%;">
        <div class="control-group">
            <label>💡 Fill Intensity <span id="fillIntensityValue">0.50</span></label>
            <input type="range" id="fillIntensitySlider" min="0" max="1.0" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>💡 Fill Azimuth <span id="fillAzimuthValue">135</span></label>
            <input type="range" id="fillAzimuthSlider" min="0" max="360" step="1" value="135">
        </div>
        <div class="control-group">
            <label>💡 Fill Elevation <span id="fillElevationValue">45</span></label>
            <input type="range" id="fillElevationSlider" min="0" max="90" step="1" value="45">
        </div>

        <button class="action-btn" id="measureBtn">📏 Measure (snap to vertex)</button>

        <div class="section-controls">
            <div style="color:#aaa; font-size:0.75rem; margin-bottom:4px;">✂️ Section Slices (%)</div>
            <div class="row">
                <input type="checkbox" id="clipX">
                <label style="width:auto; color:#ff6b6b;">X</label>
                <input type="range" id="clipXSlider" min="0" max="100" step="0.5" value="50">
                <span id="clipXVal" style="color:#888;font-size:0.7rem;width:36px;">50%</span>
            </div>
            <div class="row">
                <input type="checkbox" id="clipY">
                <label style="width:auto; color:#4caf50;">Y</label>
                <input type="range" id="clipYSlider" min="0" max="100" step="0.5" value="50">
                <span id="clipYVal" style="color:#888;font-size:0.7rem;width:36px;">50%</span>
            </div>
            <div class="row">
                <input type="checkbox" id="clipZ">
                <label style="width:auto; color:#4a9eff;">Z</label>
                <input type="range" id="clipZSlider" min="0" max="100" step="0.5" value="50">
                <span id="clipZVal" style="color:#888;font-size:0.7rem;width:36px;">50%</span>
            </div>
        </div>

        <button class="action-btn" id="resetViewBtn">🎯 Reset View</button>
        <button class="action-btn" id="resetAllBtn">↺ Reset All</button>
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- DOM refs ---
        const statusMsg = document.getElementById('statusMsg');
        const titleEl = document.getElementById('modelTitle');
        const measureLabel = document.getElementById('measureLabel');

        const exposureSlider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeValue');
        const fillIntensitySlider = document.getElementById('fillIntensitySlider');
        const fillIntensityVal = document.getElementById('fillIntensityValue');
        const fillAzimuthSlider = document.getElementById('fillAzimuthSlider');
        const fillAzimuthVal = document.getElementById('fillAzimuthValue');
        const fillElevationSlider = document.getElementById('fillElevationSlider');
        const fillElevationVal = document.getElementById('fillElevationValue');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const sunToggle = document.getElementById('sunToggle');
        const showBoxCheck = document.getElementById('showBoxCheck');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const measureBtn = document.getElementById('measureBtn');

        const clipX = document.getElementById('clipX');
        const clipY = document.getElementById('clipY');
        const clipZ = document.getElementById('clipZ');
        const clipXSlider = document.getElementById('clipXSlider');
        const clipYSlider = document.getElementById('clipYSlider');
        const clipZSlider = document.getElementById('clipZSlider');
        const clipXVal = document.getElementById('clipXVal');
        const clipYVal = document.getElementById('clipYVal');
        const clipZVal = document.getElementById('clipZVal');

        // --- Three.js setup ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.08);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x88aaff, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(5, 10, 7);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.001;
        sunLight.shadow.radius = 4;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.ShadowMaterial({
            opacity: 0.2,
            color: 0x888888,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, -0.01, 0);
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Bounding box helper ---
        let boxHelper = null;
        let modelBox = new THREE.Box3();
        let modelGroup = null;
        let modelMeshes = [];

        // --- Clipping planes ---
        const clipPlanes = {
            x: new THREE.Plane(new THREE.Vector3(1, 0, 0), 0),
            y: new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
            z: new THREE.Plane(new THREE.Vector3(0, 0, 1), 0),
        };
        let activeClipPlanes = [];

        // --- Vertex cache for snapping ---
        let allVertices = [];

        function buildVertexCache(group) {
            const positions = [];
            group.traverse((node) => {
                if (node.isMesh) {
                    const geo = node.geometry;
                    if (geo && geo.attributes && geo.attributes.position) {
                        const pos = geo.attributes.position;
                        for (let i = 0; i < pos.count; i++) {
                            const p = new THREE.Vector3();
                            p.fromBufferAttribute(pos, i);
                            p.applyMatrix4(node.matrixWorld);
                            positions.push(p);
                        }
                    }
                }
            });
            allVertices = positions;
        }

        // --- Create fallback model (box) ---
        function createFallbackModel() {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.3, metalness: 0.1 });
            const box = new THREE.Mesh(geo, mat);
            box.castShadow = true;
            box.receiveShadow = true;
            box.position.y = 0.75;
            group.add(box);
            // Add a small sphere on top
            const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.2 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.set(0, 1.5, 0);
            sphere.castShadow = true;
            group.add(sphere);
            return group;
        }

        // --- Helper functions ---
        function repositionGround(box) {
            const centerX = (box.min.x + box.max.x) / 2;
            const centerZ = (box.min.z + box.max.z) / 2;
            const bottomY = box.min.y - 0.01;
            ground.position.set(centerX, bottomY, centerZ);
        }

        function fitCameraToGroup(group) {
            try {
                const box = new THREE.Box3().setFromObject(group);
                if (!box || box.isEmpty()) {
                    throw new Error('Empty bounding box');
                }
                modelBox.copy(box);
                const size = box.max.sub(box.min);
                const maxDim = Math.max(size.x, size.y, size.z);
                const distance = maxDim * 1.8;
                camera.position.set(0, distance * 0.6, distance);
                controls.target.copy(box.center);
                controls.update();
                repositionGround(box);
                // Update clipping slider ranges (percentage)
                // They are now 0-100, no need to change range.
                // Reset clipping positions to 50%
                clipXSlider.value = 50;
                clipYSlider.value = 50;
                clipZSlider.value = 50;
                clipXVal.textContent = '50%';
                clipYVal.textContent = '50%';
                clipZVal.textContent = '50%';
                // Update bounding box
                updateBoundingBox();
                // Build vertex cache for measure snap
                if (modelGroup) buildVertexCache(modelGroup);
            } catch(e) {
                console.warn('Fit failed:', e);
                // fallback camera
                camera.position.set(3, 3, 5);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }

        function updateBoundingBox() {
            if (boxHelper) {
                scene.remove(boxHelper);
                boxHelper = null;
            }
            if (!modelGroup) return;
            if (showBoxCheck.checked) {
                boxHelper = new THREE.BoxHelper(modelGroup, 0x4caf50);
                scene.add(boxHelper);
            }
        }

        // --- Clipping update with percentage ---
        function updateClipping() {
            const planes = [];
            if (clipX.checked) {
                const pct = parseFloat(clipXSlider.value) / 100;
                const pos = modelBox.min.x + pct * (modelBox.max.x - modelBox.min.x);
                clipPlanes.x.constant = pos;
                planes.push(clipPlanes.x);
            }
            if (clipY.checked) {
                const pct = parseFloat(clipYSlider.value) / 100;
                const pos = modelBox.min.y + pct * (modelBox.max.y - modelBox.min.y);
                clipPlanes.y.constant = pos;
                planes.push(clipPlanes.y);
            }
            if (clipZ.checked) {
                const pct = parseFloat(clipZSlider.value) / 100;
                const pos = modelBox.min.z + pct * (modelBox.max.z - modelBox.min.z);
                clipPlanes.z.constant = pos;
                planes.push(clipPlanes.z);
            }
            activeClipPlanes = planes;
            if (modelGroup) {
                modelGroup.traverse((node) => {
                    if (node.isMesh) {
                        if (Array.isArray(node.material)) {
                            node.material.forEach(mat => {
                                mat.clippingPlanes = planes.length ? planes : null;
                                mat.clipShadows = true;
                                mat.needsUpdate = true;
                            });
                        } else {
                            node.material.clippingPlanes = planes.length ? planes : null;
                            node.material.clipShadows = true;
                            node.material.needsUpdate = true;
                        }
                    }
                });
            }
        }

        // --- Measure tool with snap to nearest vertex ---
        let measurePoints = [];
        let measureLine = null;
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function getNearestVertex(point, threshold = 0.05) {
            let best = null;
            let bestDist = threshold;
            for (const v of allVertices) {
                const d = point.distanceTo(v);
                if (d < bestDist) {
                    bestDist = d;
                    best = v.clone();
                }
            }
            return best;
        }

        function getIntersection(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const meshes = [];
            if (modelGroup) {
                modelGroup.traverse((node) => {
                    if (node.isMesh) meshes.push(node);
                });
            }
            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const pt = intersects[0].point;
                const snapped = getNearestVertex(pt);
                return snapped || pt;
            }
            return null;
        }

        function createMeasureLine(p1, p2) {
            if (measureLine) {
                scene.remove(measureLine);
                measureLine = null;
            }
            const points = [p1, p2];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x4caf50,
                linewidth: 2,
            });
            const line = new THREE.Line(geometry, material);
            const sphereGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x4caf50 });
            const s1 = new THREE.Mesh(sphereGeo, sphereMat);
            s1.position.copy(p1);
            const s2 = new THREE.Mesh(sphereGeo, sphereMat);
            s2.position.copy(p2);
            const group = new THREE.Group();
            group.add(line);
            group.add(s1);
            group.add(s2);
            measureLine = group;
            scene.add(group);
            const dist = p1.distanceTo(p2);
            measureLabel.textContent = `📏 ${dist.toFixed(3)} m`;
            measureLabel.classList.add('active');
            return dist;
        }

        // --- Model loading ---
        const urlParams = new URLSearchParams(window.location.search);
        let modelFile = urlParams.get('model');

        function loadModel(url) {
            const fileName = url.split('/').pop();
            statusMsg.innerHTML = `⏳ Loading <span style="color:#888;">${fileName}</span>...<br><span class="small">${url}</span>`;
            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    statusMsg.style.display = 'none';
                    titleEl.textContent = `📐 ${fileName.replace(/\.glb$/i,'')}`;
                    if (modelGroup) {
                        scene.remove(modelGroup);
                        if (boxHelper) { scene.remove(boxHelper); boxHelper = null; }
                    }
                    modelGroup = gltf.scene;
                    // Convert materials and enable clipping
                    modelGroup.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material) {
                                const oldMat = node.material;
                                const newMat = new THREE.MeshStandardMaterial({
                                    color: oldMat.color ? oldMat.color : 0xffffff,
                                    map: oldMat.map || undefined,
                                    roughness: oldMat.roughness !== undefined ? oldMat.roughness : 0.5,
                                    metalness: oldMat.metalness !== undefined ? oldMat.metalness : 0.0,
                                    envMap: null,
                                    emissive: new THREE.Color(0x000000),
                                    clippingPlanes: null,
                                    clipShadows: true,
                                });
                                node.material = newMat;
                                node.material.needsUpdate = true;
                            }
                        }
                    });
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    updateClipping();
                    buildVertexCache(modelGroup);
                    updateBoundingBox();
                    console.log('✅ Model loaded:', url);
                },
                undefined,
                (err) => {
                    console.error('❌ Model load failed:', err);
                    statusMsg.innerHTML = `
                        <span class="error">❌ Failed to load: ${fileName}</span><br>
                        <span class="small">Tried: ${url}</span><br>
                        <span style="color:#888;font-size:0.8rem;">Loading fallback box instead.</span>
                    `;
                    // Load fallback
                    if (modelGroup) scene.remove(modelGroup);
                    modelGroup = createFallbackModel();
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    updateClipping();
                    buildVertexCache(modelGroup);
                    updateBoundingBox();
                    titleEl.textContent = '📐 Fallback (Box)';
                    setTimeout(() => {
                        statusMsg.style.display = 'none';
                    }, 2000);
                }
            );
        }

        if (modelFile) {
            if (!modelFile.toLowerCase().endsWith('.glb')) {
                modelFile += '.glb';
            }
            const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');
            const fullUrl = baseUrl + modelFile;
            loadModel(fullUrl);
        } else {
            statusMsg.innerHTML = '👈 No model specified. Loading fallback box.';
            modelGroup = createFallbackModel();
            scene.add(modelGroup);
            fitCameraToGroup(modelGroup);
            updateClipping();
            buildVertexCache(modelGroup);
            updateBoundingBox();
            titleEl.textContent = '📐 Fallback (No model)';
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 1500);
        }

        // --- Controls ---
        function updateSunDirection(time) {
            const t = (time - 6) / 12;
            const azimuthDeg = 90 + t * 180;
            const elevationDeg = 60 * Math.sin(Math.PI * t);
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad);
            const y = Math.sin(elevationRad);
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad);
            sunLight.position.set(x * 10, y * 10, z * 10);
            sunLight.target.position.set(0, 0, 0);
            sunLight.target.updateMatrixWorld();
        }

        function updateFillPosition(azimuthDeg, elevationDeg) {
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const radius = 8;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad) * radius;
            const y = Math.sin(elevationRad) * radius;
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad) * radius;
            fillLight.position.set(x, y, z);
            fillLight.target.position.set(0, 0, 0);
            fillLight.target.updateMatrixWorld();
        }

        exposureSlider.addEventListener('input', () => {
            const val = parseFloat(exposureSlider.value);
            renderer.toneMappingExposure = val;
            exposureVal.textContent = val.toFixed(2);
        });

        timeSlider.addEventListener('input', () => {
            const time = parseFloat(timeSlider.value);
            const hours = Math.floor(time);
            const minutes = Math.round((time - hours) * 60);
            timeVal.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
            updateSunDirection(time);
        });

        fillIntensitySlider.addEventListener('input', () => {
            const val = parseFloat(fillIntensitySlider.value);
            fillLight.intensity = val;
            fillIntensityVal.textContent = val.toFixed(2);
        });

        fillAzimuthSlider.addEventListener('input', () => {
            const az = parseFloat(fillAzimuthSlider.value);
            const el = parseFloat(fillElevationSlider.value);
            fillAzimuthVal.textContent = az;
            updateFillPosition(az, el);
        });

        fillElevationSlider.addEventListener('input', () => {
            const az = parseFloat(fillAzimuthSlider.value);
            const el = parseFloat(fillElevationSlider.value);
            fillElevationVal.textContent = el;
            updateFillPosition(az, el);
        });

        autoRotateCheck.addEventListener('change', () => {
            controls.autoRotate = autoRotateCheck.checked;
            controls.autoRotateSpeed = 2.0;
        });

        sunToggle.addEventListener('change', () => {
            sunLight.visible = sunToggle.checked;
        });

        showBoxCheck.addEventListener('change', updateBoundingBox);

        resetViewBtn.addEventListener('click', () => {
            if (modelGroup) {
                fitCameraToGroup(modelGroup);
            }
        });

        resetAllBtn.addEventListener('click', () => {
            exposureSlider.value = '1.0';
            exposureVal.textContent = '1.00';
            renderer.toneMappingExposure = 1.0;

            timeSlider.value = '10';
            timeVal.textContent = '10:00';
            updateSunDirection(10);

            fillIntensitySlider.value = '0.5';
            fillIntensityVal.textContent = '0.50';
            fillLight.intensity = 0.5;

            fillAzimuthSlider.value = '135';
            fillAzimuthVal.textContent = '135';
            fillElevationSlider.value = '45';
            fillElevationVal.textContent = '45';
            updateFillPosition(135, 45);

            autoRotateCheck.checked = false;
            controls.autoRotate = false;
            sunToggle.checked = true;
            sunLight.visible = true;

            // Reset clipping
            clipX.checked = false;
            clipY.checked = false;
            clipZ.checked = false;
            clipXSlider.value = 50;
            clipYSlider.value = 50;
            clipZSlider.value = 50;
            clipXVal.textContent = '50%';
            clipYVal.textContent = '50%';
            clipZVal.textContent = '50%';
            updateClipping();

            // Reset measure
            if (measureLine) {
                scene.remove(measureLine);
                measureLine = null;
            }
            measureLabel.classList.remove('active');

            showBoxCheck.checked = true;
            updateBoundingBox();

            resetViewBtn.click();
        });

        // --- Clipping percentage sliders ---
        clipX.addEventListener('change', updateClipping);
        clipY.addEventListener('change', updateClipping);
        clipZ.addEventListener('change', updateClipping);

        clipXSlider.addEventListener('input', () => {
            const val = parseFloat(clipXSlider.value);
            clipXVal.textContent = `${Math.round(val)}%`;
            if (clipX.checked) updateClipping();
        });
        clipYSlider.addEventListener('input', () => {
            const val = parseFloat(clipYSlider.value);
            clipYVal.textContent = `${Math.round(val)}%`;
            if (clipY.checked) updateClipping();
        });
        clipZSlider.addEventListener('input', () => {
            const val = parseFloat(clipZSlider.value);
            clipZVal.textContent = `${Math.round(val)}%`;
            if (clipZ.checked) updateClipping();
        });

        // --- Measure tool ---
        measureBtn.addEventListener('click', () => {
            if (!modelGroup || allVertices.length === 0) {
                alert('Please load a model first.');
                return;
            }
            measurePoints = [];
            measureLabel.textContent = '📏 Click first point (snaps to vertex)';
            measureLabel.classList.add('active');
            if (measureLine) {
                scene.remove(measureLine);
                measureLine = null;
            }
            const onClick = (event) => {
                const point = getIntersection(event);
                if (!point) return;
                measurePoints.push(point.clone());
                if (measurePoints.length === 1) {
                    measureLabel.textContent = '📏 Click second point (snaps to vertex)';
                } else if (measurePoints.length === 2) {
                    createMeasureLine(measurePoints[0], measurePoints[1]);
                    renderer.domElement.removeEventListener('click', onClick);
                }
            };
            renderer.domElement.addEventListener('click', onClick);
        });

        // --- Init ---
        updateSunDirection(10);
        updateFillPosition(135, 45);
        timeVal.textContent = '10:00';

        // --- Resize ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // --- Animation ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.THREE_VIEWER = { scene, camera, renderer, controls, sunLight, fillLight, modelGroup, boxHelper };
    </script>
</body>
</html>
