<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer (Three.js)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; overflow: hidden; }
        canvas { display: block; }

        .controls-panel {
            position: absolute; bottom: 30px; right: 30px; z-index: 10;
            background: rgba(20,20,20,0.92); backdrop-filter: blur(8px);
            padding: 18px 22px; border-radius: 16px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 12px; min-width: 220px;
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }
        .controls-panel::-webkit-scrollbar { width: 4px; }
        .controls-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { color: #aaa; font-size: 0.75rem; font-weight: 300; display: flex; justify-content: space-between; }
        .control-group label span { color: #eee; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #4caf50; background: #444; height: 4px; border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.75rem; }
        .checkbox-group input[type="checkbox"] { accent-color: #4caf50; width: 16px; height: 16px; cursor: pointer; }
        .action-btn {
            background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid #4caf50;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            font-weight: 500; transition: all 0.2s; text-align: center; margin-top: 4px;
        }
        .action-btn:hover { background: rgba(76,175,80,0.5); transform: scale(1.02); }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            color: white; border: 1px solid #444; padding: 12px 24px;
            border-radius: 50px; font-size: 1rem; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .back-btn:hover { background: rgba(76,175,80,0.8); border-color: #4caf50; transform: scale(1.05); }
        .model-title {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            color: #eee; padding: 10px 20px; border-radius: 30px;
            font-size: 0.9rem; border: 1px solid #333; pointer-events: none;
        }
        .status-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #888; font-size: 1.1rem; pointer-events: none; text-align: center; z-index: 0;
            background: rgba(0,0,0,0.6); padding: 20px 30px; border-radius: 12px;
            border: 1px solid #333;
            max-width: 80%;
            line-height: 1.6;
        }
        .status-msg .error { color: #ff6b6b; }
        .status-msg .small { font-size: 0.8rem; color: #666; }
        @media (max-width: 600px) {
            .controls-panel { bottom: 15px; right: 15px; padding: 12px 16px; min-width: 170px; max-height: 60vh; gap: 8px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.85rem; }
            .model-title { top: 15px; right: 15px; padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Library</a>
    <div class="model-title" id="modelTitle">Loading...</div>
    <div class="status-msg" id="statusMsg">⏳ Loading model...</div>

    <div class="controls-panel">
        <div class="checkbox-group">
            <input type="checkbox" id="autoRotateCheck">
            <label for="autoRotateCheck">🔄 Auto-Rotate</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="sunToggle" checked>
            <label for="sunToggle">☀️ Sun On/Off</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="wireframeToggle">
            <label for="wireframeToggle">🔲 Wireframe Overlay</label>
        </div>
        <div class="control-group">
            <label>🔆 Brightness <span id="exposureValue">1.00</span></label>
            <input type="range" id="exposureSlider" min="0.2" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>💡 Ambient Light <span id="ambientValue">1.00</span></label>
            <input type="range" id="ambientSlider" min="0" max="10" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>🌓 Shadow Intensity <span id="shadowValue">1.00</span></label>
            <input type="range" id="shadowSlider" min="0" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>🌑 Shadow Transparency <span id="shadowOpacityValue">0.40</span></label>
            <input type="range" id="shadowOpacitySlider" min="0" max="1.0" step="0.01" value="0.4">
        </div>
        <div class="control-group">
            <label>☀️ Sun Position (Time) <span id="timeValue">12:00</span></label>
            <input type="range" id="timeSlider" min="6" max="18" step="0.1" value="12">
        </div>
        <div class="control-group">
            <label>✏️ Edge Width <span id="edgeValue">2.0</span></label>
            <input type="range" id="edgeSlider" min="0" max="10" step="0.1" value="2.0">
        </div>
        <button class="action-btn" id="resetViewBtn">🎯 Reset View</button>
        <button class="action-btn" id="resetAllBtn">↺ Reset All</button>
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- DOM refs ---
        const statusMsg = document.getElementById('statusMsg');
        const titleEl = document.getElementById('modelTitle');

        const exposureSlider = document.getElementById('exposureSlider');
        const exposureVal = document.getElementById('exposureValue');
        const ambientSlider = document.getElementById('ambientSlider');
        const ambientVal = document.getElementById('ambientValue');
        const shadowSlider = document.getElementById('shadowSlider');
        const shadowVal = document.getElementById('shadowValue');
        const shadowOpacitySlider = document.getElementById('shadowOpacitySlider');
        const shadowOpacityVal = document.getElementById('shadowOpacityValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeVal = document.getElementById('timeValue');
        const edgeSlider = document.getElementById('edgeSlider');
        const edgeVal = document.getElementById('edgeValue');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const sunToggle = document.getElementById('sunToggle');
        const wireframeToggle = document.getElementById('wireframeToggle');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');

        // --- Three.js setup ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // --- Lights ---
        // Ambient light (affects all surfaces)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // Hemisphere light for fill from above/below
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x404060, 0.6);
        scene.add(hemiLight);

        // Main directional light (sun)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.1;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -10;
        mainLight.shadow.camera.right = 10;
        mainLight.shadow.camera.top = 10;
        mainLight.shadow.camera.bottom = -10;
        mainLight.shadow.bias = -0.001;
        scene.add(mainLight);

        // --- Ground plane (shadow receiver) ---
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x222222,
            transparent: true,
            opacity: 0.4,
            roughness: 1,
            metalness: 0,
            depthWrite: false,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, -0.01, 0);
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20, 0x666666, 0x333333);
        gridHelper.position.set(0, -0.01, 0);
        scene.add(gridHelper);

        // --- Post-processing (Outline) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
        outlinePass.edgeStrength = 5.0;
        outlinePass.edgeGlow = 0.0;
        outlinePass.edgeThickness = 2.0;
        outlinePass.pulsePeriod = 0;
        outlinePass.visibleEdgeColor.set(0x000000);
        outlinePass.hiddenEdgeColor.set(0x000000);
        composer.addPass(outlinePass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // --- Model loading ---
        const urlParams = new URLSearchParams(window.location.search);
        let modelFile = urlParams.get('model');

        let modelGroup = null;
        let wireframeGroup = null;

        function repositionGroundAndGrid(box) {
            const centerX = (box.min.x + box.max.x) / 2;
            const centerZ = (box.min.z + box.max.z) / 2;
            const bottomY = box.min.y - 0.01;
            ground.position.set(centerX, bottomY, centerZ);
            gridHelper.position.set(centerX, bottomY, centerZ);
        }

        function fitCameraToGroup(group) {
            const box = new THREE.Box3().setFromObject(group);
            const size = box.max.sub(box.min);
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 1.8;
            camera.position.set(0, distance * 0.6, distance);
            controls.target.copy(box.center);
            controls.update();
            repositionGroundAndGrid(box);
        }

        function loadModel(url) {
            const fileName = url.split('/').pop();
            statusMsg.innerHTML = `⏳ Loading <span style="color:#888;">${fileName}</span>...<br><span class="small">${url}</span>`;
            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    statusMsg.style.display = 'none';
                    titleEl.textContent = `📐 ${fileName.replace(/\.glb$/i,'')}`;
                    if (modelGroup) {
                        scene.remove(modelGroup);
                    }
                    if (wireframeGroup) {
                        scene.remove(wireframeGroup);
                        wireframeGroup = null;
                    }
                    modelGroup = gltf.scene;
                    // Enable shadows and ensure materials are standard
                    modelGroup.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material) {
                                // Ensure material is responsive to lights
                                if (node.material.isMeshStandardMaterial || node.material.isMeshPhongMaterial) {
                                    node.material.needsUpdate = true;
                                } else {
                                    // Convert to standard material to respond to lights
                                    const oldMat = node.material;
                                    const newMat = new THREE.MeshStandardMaterial({
                                        color: oldMat.color ? oldMat.color : 0xffffff,
                                        map: oldMat.map || undefined,
                                        roughness: oldMat.roughness !== undefined ? oldMat.roughness : 0.5,
                                        metalness: oldMat.metalness !== undefined ? oldMat.metalness : 0.0,
                                    });
                                    node.material = newMat;
                                    node.material.needsUpdate = true;
                                }
                            }
                        }
                    });
                    scene.add(modelGroup);
                    fitCameraToGroup(modelGroup);
                    outlinePass.selectedObjects = [modelGroup];
                    console.log('✅ Model loaded:', url);
                },
                undefined,
                (err) => {
                    console.error('❌ Model load failed:', err);
                    statusMsg.innerHTML = `
                        <span class="error">❌ Failed to load: ${fileName}</span><br>
                        <span class="small">Tried: ${url}</span><br>
                        <span style="color:#888;font-size:0.8rem;">Check that the file exists and is accessible.</span>
                    `;
                    titleEl.textContent = '⚠️ Error';
                }
            );
        }

        if (modelFile) {
            if (!modelFile.toLowerCase().endsWith('.glb')) {
                modelFile += '.glb';
            }
            const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');
            const fullUrl = baseUrl + modelFile;
            loadModel(fullUrl);
        } else {
            statusMsg.innerHTML = '👈 No model specified. Please add ?model=yourfile.glb to the URL.';
            titleEl.textContent = 'No Model';
        }

        // --- Controls ---
        function updateSunDirection(time) {
            const t = (time - 6) / 12;
            const azimuthDeg = 90 + t * 180;
            const elevationDeg = 60 * Math.sin(Math.PI * t);
            const azimuthRad = azimuthDeg * Math.PI / 180;
            const elevationRad = elevationDeg * Math.PI / 180;
            const x = Math.cos(azimuthRad) * Math.cos(elevationRad);
            const y = Math.sin(elevationRad);
            const z = Math.sin(azimuthRad) * Math.cos(elevationRad);
            mainLight.position.set(x * 10, y * 10, z * 10);
            mainLight.target.position.set(0, 0, 0);
            mainLight.target.updateMatrixWorld();
        }

        exposureSlider.addEventListener('input', () => {
            const val = parseFloat(exposureSlider.value);
            renderer.toneMappingExposure = val;
            exposureVal.textContent = val.toFixed(2);
        });

        ambientSlider.addEventListener('input', () => {
            const val = parseFloat(ambientSlider.value);
            ambientLight.intensity = val;
            ambientVal.textContent = val.toFixed(2);
        });

        shadowSlider.addEventListener('input', () => {
            const val = parseFloat(shadowSlider.value);
            mainLight.intensity = val;
            shadowVal.textContent = val.toFixed(2);
        });

        shadowOpacitySlider.addEventListener('input', () => {
            const val = parseFloat(shadowOpacitySlider.value);
            ground.material.opacity = val;
            shadowOpacityVal.textContent = val.toFixed(2);
        });

        timeSlider.addEventListener('input', () => {
            const time = parseFloat(timeSlider.value);
            const hours = Math.floor(time);
            const minutes = Math.round((time - hours) * 60);
            timeVal.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
            updateSunDirection(time);
        });

        edgeSlider.addEventListener('input', () => {
            const val = parseFloat(edgeSlider.value);
            edgeVal.textContent = val.toFixed(1);
            outlinePass.edgeThickness = val;
        });

        autoRotateCheck.addEventListener('change', () => {
            controls.autoRotate = autoRotateCheck.checked;
            controls.autoRotateSpeed = 2.0;
        });

        sunToggle.addEventListener('change', () => {
            mainLight.visible = sunToggle.checked;
        });

        // Wireframe toggle – adds a wireframe overlay on the model
        wireframeToggle.addEventListener('change', () => {
            if (!modelGroup) return;
            if (wireframeToggle.checked) {
                if (!wireframeGroup) {
                    wireframeGroup = new THREE.Group();
                    modelGroup.traverse((node) => {
                        if (node.isMesh) {
                            const wireframeMat = new THREE.MeshBasicMaterial({
                                color: 0xffffff,
                                wireframe: true,
                                transparent: true,
                                opacity: 0.3,
                            });
                            const wireframeMesh = new THREE.Mesh(node.geometry.clone(), wireframeMat);
                            wireframeMesh.position.copy(node.position);
                            wireframeMesh.rotation.copy(node.rotation);
                            wireframeMesh.scale.copy(node.scale);
                            wireframeGroup.add(wireframeMesh);
                        }
                    });
                    scene.add(wireframeGroup);
                }
            } else {
                if (wireframeGroup) {
                    scene.remove(wireframeGroup);
                    wireframeGroup = null;
                }
            }
        });

        resetViewBtn.addEventListener('click', () => {
            if (modelGroup) {
                fitCameraToGroup(modelGroup);
            }
        });

        resetAllBtn.addEventListener('click', () => {
            exposureSlider.value = '1.0';
            exposureVal.textContent = '1.00';
            renderer.toneMappingExposure = 1.0;

            ambientSlider.value = '1.0';
            ambientVal.textContent = '1.00';
            ambientLight.intensity = 1.0;

            shadowSlider.value = '1.0';
            shadowVal.textContent = '1.00';
            mainLight.intensity = 1.0;

            shadowOpacitySlider.value = '0.4';
            shadowOpacityVal.textContent = '0.40';
            ground.material.opacity = 0.4;

            timeSlider.value = '12';
            timeVal.textContent = '12:00';
            updateSunDirection(12);

            edgeSlider.value = '2.0';
            edgeVal.textContent = '2.0';
            outlinePass.edgeThickness = 2.0;

            autoRotateCheck.checked = false;
            controls.autoRotate = false;

            sunToggle.checked = true;
            mainLight.visible = true;

            wireframeToggle.checked = false;
            if (wireframeGroup) {
                scene.remove(wireframeGroup);
                wireframeGroup = null;
            }

            resetViewBtn.click();
        });

        // Init sun
        updateSunDirection(12);

        // --- Resize ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            outlinePass.resolution.set(w, h);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            composer.render();
        }
        animate();

        window.THREE_VIEWER = { scene, camera, renderer, controls, mainLight, outlinePass, ambientLight, ground };
    </script>
</body>
</html>
